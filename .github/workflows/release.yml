name: Release

on:
  push:
    tags: ["v*"]
  # Finishes a release that stopped partway. It runs this file from the
  # branch it is dispatched on but builds, checks and publishes the tag's own
  # source, and every step that already happened is skipped rather than
  # repeated: npm and the MCP Registry refuse a version twice, and a GHCR tag
  # somebody may have pinned is never pushed over.
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to finish publishing, for example v0.6.0
        required: true
        type: string

run-name: Release ${{ inputs.release_tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  MCP_PUBLISHER_VERSION: "1.8.0"
  MCP_PUBLISHER_LINUX_AMD64_SHA256: 1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  sdk-parity:
    uses: ./.github/workflows/sdk-parity.yml
    permissions:
      contents: read
    with:
      source_ref: ${{ inputs.release_tag || github.sha }}

  publish:
    needs: sdk-parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      # The tag's source is what gets built and published; the check below
      # comes from the ref this workflow runs from, because a tag cut before
      # the check existed does not carry it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: .release-tools
          sparse-checkout: scripts/published-image.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Resolve the release tag
        id: tag
        run: |
          printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "^22.22.2"
          cache: npm
        # No registry-url: it makes setup-node write
        # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} into .npmrc, and
        # npm prefers that over OIDC. Dropping NODE_AUTH_TOKEN was enough to
        # let trusted publishing work, but only because the token expands to
        # empty; anyone re-adding the env would silently bypass OIDC again.
        # npm publishes to registry.npmjs.org by default, so nothing is lost.

      - name: Ensure npm supports trusted publishing
        # node 22 ships npm 10, which has no OIDC support, so npm silently
        # falls back to token auth and the trusted publisher is never used.
        # thalovant-node-sdk pins the same version for the same reason.
        run: npm install -g npm@12.0.1

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - id: package
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify release tag matches the package version
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"
          test "$(node -p "require('./server.json').version")" = "$PACKAGE_VERSION"

      - name: Check what is already published
        id: published
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          SOURCE_COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          if npm view --prefer-online "@thalovant/mcp-server@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "npm=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm=false" >> "$GITHUB_OUTPUT"
          fi
          # Fails the job when the tag exists but was built from another commit.
          image="$(node .release-tools/scripts/published-image.mjs "$PACKAGE_VERSION" "$SOURCE_COMMIT")"
          echo "$image"
          if [ "$image" = absent ]; then
            echo "image=false" >> "$GITHUB_OUTPUT"
          else
            echo "image=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package artifact and CycloneDX SBOM
        id: artifacts
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          NPM_PUBLISHED: ${{ steps.published.outputs.npm }}
        run: |
          mkdir -p release-artifacts
          npm sbom --omit=dev --sbom-format cyclonedx > "release-artifacts/thalovant-mcp-$PACKAGE_VERSION.cdx.json"
          # Once npm serves the version, the artifact is the tarball it serves
          # (npm checks it against the registry's integrity), not a rebuild.
          if [ "$NPM_PUBLISHED" = true ]; then PACK_SPEC="@thalovant/mcp-server@$PACKAGE_VERSION"; else PACK_SPEC=.; fi
          PACKAGE_FILE="$(npm pack "$PACK_SPEC" --pack-destination release-artifacts --json | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const parsed = JSON.parse(input); const entry = Array.isArray(parsed) ? parsed[0] : Object.values(parsed)[0]; if (!entry?.filename) throw new Error("npm pack did not return a package filename"); console.log(entry.filename); });')"
          echo "tarball=$GITHUB_WORKSPACE/release-artifacts/$PACKAGE_FILE" >> "$GITHUB_OUTPUT"
          echo "sbom=$GITHUB_WORKSPACE/release-artifacts/thalovant-mcp-$PACKAGE_VERSION.cdx.json" >> "$GITHUB_OUTPUT"

      - name: Attest package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.artifacts.outputs.tarball }}

      - name: Attest package SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.artifacts.outputs.tarball }}
          sbom-path: ${{ steps.artifacts.outputs.sbom }}

      - name: Publish npm package
        # No NODE_AUTH_TOKEN: setup-node writes it into .npmrc as an
        # _authToken, and npm prefers that over OIDC, so the trusted publisher
        # configured for this repository is bypassed in favour of a token that
        # npm rejects with "E404 Not Found - PUT" (its response for an
        # unauthorized publish).
        env:
          PACKAGE_TARBALL: ${{ steps.artifacts.outputs.tarball }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          if npm view --prefer-online "@thalovant/mcp-server@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "@thalovant/mcp-server@${PACKAGE_VERSION} is already published; skipping npm publish."
          elif ! npm publish "$PACKAGE_TARBALL" --access public --provenance; then
            # npm's read path lags its write path, so a version published a
            # moment ago can look missing here and then refuse the publish.
            sleep 60
            if npm view --prefer-online "@thalovant/mcp-server@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
              echo "@thalovant/mcp-server@${PACKAGE_VERSION} was already published; continuing."
            else
              exit 1
            fi
          fi

      - name: Image already published
        if: steps.published.outputs.image == 'true'
        run: echo "ghcr.io/thalovant/thalovant-mcp:${{ steps.package.outputs.version }} is already published from ${{ steps.tag.outputs.commit }}; not pushing it, or latest, again."

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.published.outputs.image == 'false'

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: steps.published.outputs.image == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        if: steps.published.outputs.image == 'false'
        id: meta
        with:
          images: ghcr.io/thalovant/thalovant-mcp
          tags: |
            type=raw,value=${{ steps.package.outputs.version }}
            type=raw,value=latest

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        if: steps.published.outputs.image == 'false'
        with:
          context: .
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install and verify the published npm stdio artifact
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          # npm's read path can lag its write path by minutes: v0.6.0 was
          # published at 11:45:45 and served at about 11:50:50, and the two
          # minutes this loop used to wait failed a release that had worked.
          # 10 s for the first minute, then 30 s, up to about 15 minutes.
          # --prefer-online, because a warm metadata cache keeps saying missing.
          served=false
          for attempt in $(seq 1 34); do
            if npm view --prefer-online "@thalovant/mcp-server@$PACKAGE_VERSION" version >/dev/null 2>&1; then
              served=true
              echo "npm serves @thalovant/mcp-server@$PACKAGE_VERSION after ${attempt} attempt(s)."
              break
            fi
            if [ "$attempt" -le 6 ]; then sleep 10; else sleep 30; fi
          done
          if [ "$served" != true ]; then
            echo "@thalovant/mcp-server@$PACKAGE_VERSION was not served by npm after ~15 minutes."
            echo "The publish may still have worked: check the registry, then dispatch this workflow with release_tag=$RELEASE_TAG."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/thalovant-mcp-smoke"
          npm install --prefix "$RUNNER_TEMP/thalovant-mcp-smoke" "@thalovant/mcp-server@$PACKAGE_VERSION"
          node scripts/smoke-published.mjs stdio "$RUNNER_TEMP/thalovant-mcp-smoke/node_modules/.bin/thalovant-mcp"

      - name: Start and verify the published OCI Streamable HTTP artifact
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          docker pull "ghcr.io/thalovant/thalovant-mcp:$PACKAGE_VERSION"
          docker run -d --name thalovant-mcp-smoke -p 127.0.0.1:3000:3000 -e MCP_HTTP_AUTH_TOKEN=published-smoke-token -e MCP_HTTP_ALLOWED_HOSTS=127.0.0.1:3000,localhost:3000 "ghcr.io/thalovant/thalovant-mcp:$PACKAGE_VERSION"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz >/dev/null; then
              node scripts/smoke-published.mjs http http://127.0.0.1:3000/mcp published-smoke-token
              docker stop --time 12 thalovant-mcp-smoke
              test "$(docker inspect -f '{{.State.ExitCode}}' thalovant-mcp-smoke)" = 0
              docker rm thalovant-mcp-smoke
              exit 0
            fi
            sleep 1
          done
          docker logs thalovant-mcp-smoke
          docker rm -f thalovant-mcp-smoke
          exit 1

      - name: Install MCP publisher
        run: |
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --retry 3 --output "$archive" "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/$archive"
          echo "${MCP_PUBLISHER_LINUX_AMD64_SHA256}  $archive" | sha256sum --check --strict
          tar xzf "$archive" mcp-publisher

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          if curl -fsSL "https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.thalovant/thalovant-mcp" \
            | node -e "const data = JSON.parse(require('fs').readFileSync(0, 'utf8')); const version = process.env.PACKAGE_VERSION; process.exit(data.servers?.some((entry) => entry.server?.name === 'io.github.thalovant/thalovant-mcp' && entry.server?.version === version) ? 0 : 1)"; then
            echo "io.github.thalovant/thalovant-mcp ${PACKAGE_VERSION} is already in the MCP Registry; skipping publish."
          else
            set +e
            publish_output="$(./mcp-publisher publish 2>&1)"
            publish_code=$?
            set -e
            printf '%s\n' "$publish_output"
            if [ "$publish_code" -ne 0 ]; then
              if printf '%s' "$publish_output" | grep -qiE "duplicate version|already (exists|published)"; then
                echo "MCP Registry already has ${PACKAGE_VERSION} (publish reported duplicate); treating as already published."
              else
                exit "$publish_code"
              fi
            fi
          fi
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}

      - name: Create GitHub release with package and SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.artifacts.outputs.tarball }}
          SBOM: ${{ steps.artifacts.outputs.sbom }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            EXISTING_ASSETS="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
            for artifact in "$TARBALL" "$SBOM"; do
              name="$(basename "$artifact")"
              if grep -Fxq "$name" <<< "$EXISTING_ASSETS"; then
                echo "$name is already attached to $RELEASE_TAG; preserving the existing asset."
              else
                gh release upload "$RELEASE_TAG" "$artifact"
              fi
            done
          else
            gh release create "$RELEASE_TAG" "$TARBALL" "$SBOM" --verify-tag --title "$RELEASE_TAG" --notes "Release $RELEASE_TAG"
          fi
